<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing you in... - Versivv</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-md rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900 text-center p-8">
    
    <!-- Loading State -->
    <div id="loading-container" class="flex flex-col items-center space-y-4">
      <i data-lucide="loader-2" class="h-8 w-8 animate-spin text-black dark:text-white"></i>
      <h3 class="text-xl font-semibold leading-none tracking-tight">Signing you in...</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400">Please wait while we complete your login.</p>
    </div>

    <!-- Error State -->
    <div id="error-container" class="hidden flex-col items-center space-y-4">
      <div class="rounded-full bg-red-100 p-3 dark:bg-red-900/20">
        <i data-lucide="alert-circle" class="h-6 w-6 text-red-600 dark:text-red-400"></i>
      </div>
      <h3 class="text-xl font-semibold leading-none tracking-tight text-red-600 dark:text-red-400">Authentication Failed</h3>
      <p id="error-message" class="text-sm text-gray-500 dark:text-gray-400">An unexpected error occurred.</p>
      <button id="return-btn" class="mt-4 inline-flex h-10 items-center justify-center rounded-lg bg-black px-6 py-2 text-sm font-medium text-white transition-colors hover:bg-black/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2 dark:bg-white dark:text-black dark:hover:bg-white/90">
        Return to App
      </button>
    </div>

  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/callback.js"></script>
</body>
</html>
