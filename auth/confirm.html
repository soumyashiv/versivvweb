<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmation - Versivv</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 flex min-h-screen items-center justify-center p-4">
  
  <div id="loading-state" class="flex flex-col items-center justify-center">
    <i data-lucide="loader-2" class="h-8 w-8 animate-spin text-gray-500"></i>
  </div>

  <div id="success-state" class="hidden w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900 text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-green-100 dark:bg-green-900/20">
      <i data-lucide="check-circle-2" class="h-6 w-6 text-green-600 dark:text-green-400"></i>
    </div>
    <h3 class="text-2xl font-semibold leading-none tracking-tight mb-2">Email Confirmed Successfully</h3>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Your email has been verified. You can now sign in to your Versivv account.</p>
    
    <div class="flex flex-col space-y-2">
      <a href="/index.html" class="inline-flex h-10 items-center justify-center rounded-lg bg-black px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-black/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 dark:bg-white dark:text-black dark:hover:bg-white/90">
        Go to Sign In
      </a>
      <a href="/index.html" class="inline-flex h-10 items-center justify-center rounded-lg border border-gray-200 bg-transparent px-4 py-2 text-sm font-medium text-black transition-colors hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 dark:border-gray-800 dark:text-white dark:hover:bg-gray-800">
        Return Home
      </a>
    </div>
  </div>

  <div id="error-state" class="hidden w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900 text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/20">
      <i data-lucide="x-circle" class="h-6 w-6 text-red-600 dark:text-red-400"></i>
    </div>
    <h3 class="text-2xl font-semibold leading-none tracking-tight mb-2">Confirmation Failed</h3>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">The confirmation link is invalid or has expired.</p>
    
    <div class="flex flex-col space-y-2">
      <a href="/index.html" class="inline-flex h-10 items-center justify-center rounded-lg bg-black px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-black/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 dark:bg-white dark:text-black dark:hover:bg-white/90">
        Return to Sign In
      </a>
      <a href="/index.html" class="inline-flex h-10 items-center justify-center rounded-lg border border-gray-200 bg-transparent px-4 py-2 text-sm font-medium text-black transition-colors hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 dark:border-gray-800 dark:text-white dark:hover:bg-gray-800">
        Return Home
      </a>
    </div>
  </div>

  <script src="/js/confirm.js"></script>
</body>
</html>
