<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Versivv</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-md rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900">
    <div class="flex flex-col space-y-1.5 p-6 pb-4">
      <h3 class="text-2xl font-semibold leading-none tracking-tight">Forgot Password</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400">Enter your email to receive a password reset link.</p>
    </div>
    <div class="p-6 pt-0">
      <form id="forgot-form" class="space-y-4">
        <div class="space-y-2">
          <label class="text-sm font-medium" for="email">Email</label>
          <input 
            id="email" 
            type="email" 
            required
            class="flex h-10 w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black dark:border-gray-700 dark:focus-visible:ring-white"
            placeholder="you@example.com"
          />
        </div>
        
        <div id="form-error" class="hidden rounded-md bg-red-50 p-3 text-sm text-red-600 dark:bg-red-900/20 dark:text-red-400"></div>
        <div id="form-success" class="hidden rounded-md bg-green-50 p-3 text-sm text-green-600 dark:bg-green-900/20 dark:text-green-400">Password reset link sent! Check your email.</div>

        <button type="submit" id="submit-btn" class="mt-4 inline-flex h-10 w-full items-center justify-center rounded-lg bg-black px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-black/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 dark:bg-white dark:text-black dark:hover:bg-white/90">
          <i data-lucide="loader-2" id="submit-spinner" class="mr-2 h-4 w-4 animate-spin hidden text-white dark:text-black"></i>
          Send Reset Link
        </button>

        <div class="mt-4 text-center text-sm">
          <a href="/index.html" class="text-gray-500 hover:text-black dark:hover:text-white transition-colors">Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
